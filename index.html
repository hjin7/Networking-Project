<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Networking Project</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body>

    <nav>
        <a class="nav-link" href="index.html">
            Home
        </a>
    </nav>

    <h1>Computer Networking Project - Hyoju Jin</h1>

    <p>
        Welcome to my website! This is part of my Computer Networking project.
    </p>

    <p>
        Go to the Networking Concepts page below:
    </p>

    <h2>Leave Feedback</h2>

    <input
        type="text"
        id="userInput"
        placeholder="Enter your feedback">

    <button onclick="displayFeedback()">
        Submit
    </button>

    <h3>Sanitized Output</h3>

    <div id="output"></div>

    <nav>
        <a class="nav-link" href="networking.html">
            Networking Concepts
        </a>
    </nav>


    <script>
        function displayFeedback() {

            const userInput =
                document.getElementById("userInput").value;

            const cleanInput =
                DOMPurify.sanitize(userInput);

            document.getElementById("output").innerHTML =
                cleanInput;
        }
    </script>

</body>

</html>
